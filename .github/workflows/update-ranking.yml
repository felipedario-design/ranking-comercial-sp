name: Atualizar ranking comercial

on:
  schedule:
    # A cada hora, aos 10 minutos (horário UTC).
    - cron: "10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-ranking
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Buscar dados e atualizar index.html
        run: python3 scripts/update_ranking.py

      - name: Publicar mudanças (se houver)
        run: |
          if git diff --quiet -- index.html; then
            echo "Nada mudou."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Atualiza ranking comercial São Paulo [automated]"
          git push
